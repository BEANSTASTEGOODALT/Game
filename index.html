<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Science+Gothic:wght@100..900&display=swap');


        body {
            text-align: center;
            align-items: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        .button {
            filter: hue-rotate(30deg);
            display: inline-block;
            width: 200px;
            text-align: center;
            color: white;
            text-shadow: 0 0 5px white;
            cursor: pointer;
            transition: filter 0.3s ease;
            font-family: "Monospace", 'Arial', sans-serif;
            border: 2px solid rgb(196, 211, 243);
            padding: 10px 20px;
            margin: 10px;
            border-radius: 10px;
            background: radial-gradient(circle, rgba(242, 23, 85, 0.829), rgba(78, 2, 2, 0.829));
        }

        .button:hover {
            filter: hue-rotate(-30deg);
        }

        .start {
            width: 300px;
            height: 60px;
            font-size: 24px;
            padding-top: 25px;
            padding-bottom: 0px;
        }

        .title {
            font-family: "Science Gothic", 'Arial', sans-serif;
            font-size: 48px;
            color: white;
            animation: glow 10s infinite;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes glow {
            0% {
                text-shadow:
                    0 0 15px rgb(60, 1, 11),
                    0 0 30px black;
            }

            25% {
                text-shadow: 0 0 15px rgb(150, 7, 7),
                    0 0 30px black;
            }

            50% {
                text-shadow: 0 0 15px rgb(176, 11, 11),
                    0 0 30px black;
            }

            75% {
                text-shadow: 0 0 15px rgb(185, 4, 4),
                    0 0 30px black;
            }

            100% {
                text-shadow: 0 0 15px rgb(255, 40, 40),
                    0 0 30px black;
            }
        }
    </style>
</head>

<body>
    <video autoplay muted loop playsinline class="bg-video">
        <source id="bgVid" type="video/mp4">
        <script>
            document.getElementById('bgVid').src = ['bg1.mp4', 'bg2.mp4', 'bg3.mp4', 'bg4.mp4', 'bg5.mp4'][Math.floor(Math.random() * 5)];
        </script>
    </video>
    <h1 class="title">My Game</h1>
        <div class="button" onclick="settings()">
            Settings
        </div>
        <div class="button start" onclick="startGame()">
            Start Game
        </div>
        <div class="button" onclick="credits()">
            Credits
        </div>
    <script>
        function startGame() {
            location.href = "game.html";
        }

        function settings() {
            location.href = "settings.html";
        }

        function credits() {
            location.href = "credits.html";
        }
    </script>
</body>

</html>
